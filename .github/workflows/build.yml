name: build

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release_scripts:
    name: Release script regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n build.sh .github/scripts/build-freebsd.sh
      - name: Test failure propagation and release packaging
        run: python3 .github/scripts/test-release-build.py

  xgo_build:
    name: Xgo security build
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          swap-storage: false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install xgo
        run: go install github.com/crazy-max/xgo@latest
      - name: Build patched xgo image and cross-compile
        run: |
          go_version=$(awk '$1 == "go" { print $2; exit }' go.mod)
          image="alist-xgo:$go_version"
          docker build --build-arg "GO_VERSION=$go_version" -t "$image" -f .github/docker/Dockerfile.xgo .
          xgo -docker-image "$image" -targets=linux/amd64,windows/amd64,darwin/arm64 -out alist -tags=jsoniter .
      - name: Verify embedded Go and security dependency versions
        run: |
          go_version=$(awk '$1 == "go" { print $2; exit }' go.mod)
          for binary in alist-linux-amd64 alist-windows-amd64.exe alist-darwin-arm64; do
            info=$(go version -m "$binary")
            echo "$info"
            [[ "$(head -n 1 <<< "$info")" == "$binary: go$go_version" ]]
            for module in golang.org/x/net golang.org/x/crypto; do
              expected=$(awk -v module="$module" '$1 == module { print $2; exit }' go.mod)
              actual=$(awk -v module="$module" '$1 == "dep" && $2 == module { print $3 }' <<< "$info")
              [[ "$actual" == "$expected" ]]
            done
          done

  build:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        target: 
          - darwin-amd64
          - darwin-arm64
          - windows-amd64
          - linux-arm64-musl
          - linux-amd64-musl
          - windows-arm64
          - android-arm64
          - freebsd-386
          - freebsd-amd64
          - freebsd-arm64
    name: Build
    runs-on: ${{ matrix.platform }}
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Setup web
        run: bash build.sh dev web

      - name: Build
        if: ${{ !startsWith(matrix.target, 'freebsd-') }}
        uses: go-cross/cgo-actions@v1
        with:
          targets: ${{ matrix.target }}
          musl-target-format: $os-$musl-$arch
          out-dir: build
          x-flags: |
            github.com/alist-org/alist/v3/internal/conf.BuiltAt=$built_at
            github.com/alist-org/alist/v3/internal/conf.GitAuthor=Xhofe
            github.com/alist-org/alist/v3/internal/conf.GitCommit=$git_commit
            github.com/alist-org/alist/v3/internal/conf.Version=$tag
            github.com/alist-org/alist/v3/internal/conf.WebVersion=dev

      - name: Build FreeBSD
        if: startsWith(matrix.target, 'freebsd-')
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/build-freebsd.sh "${TARGET#freebsd-}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alist_${{ env.SHA }}_${{ matrix.target }}
          path: build/*
          if-no-files-found: error
